start:
  fa: |
    👋 سلام و خوش اومدی به ربات!

    ⭐ هر ۲ ساعت با دستور /claim می‌تونی بین *۵- تا ۲۰+ استار* دریافت کنی!

    🎮 با دستور /pvp می‌تونی توی گروه‌ها با بقیه رقابت کنی و شرط‌بندی کنی. یادت باشه:
    🏆 امتیاز بازی به *برد و باخت‌هات* بستگی داره، نه تعداد استارهات!

    🆘 برای مشاهده راهنما از دستور /help استفاده کن.

  en: |
    👋 Hello and welcome to the bot!

    ⭐ Every 2 hours, use /claim to receive between *5- and 20+ Stars*!

    🎮 Use /pvp in groups to compete and place bets against other players. Remember:
    🏆 Your score depends on your *wins and losses*, not your number of Stars!

    🆘 Use /help to view the guide.

claim:
  fa: |
    📊 *گزارش دریافت ستاره‌ها*

    ✨ ستاره‌های دریافتی: {stars} ستاره
    💰 موجودی قبلی: {oldStars} ستاره
    📈 موجودی جدید: {newStars} ستاره

    🎉 مبارکه! هر ۲ ساعت می‌تونی دوباره ستاره دریافت کنی!

  en: |
    📊 *Star Claim Report*

    ✨ Stars claimed: {stars} stars
    💰 Previous balance: {oldStars} stars
    📈 New balance: {newStars} stars

    🎉 Congratulations! You can claim stars again every 2 hours!

claimRemaining:
  fa: |
    ⏳ هنوز برای دریافت ستاره‌ها زوده!

    🕐 زمان باقی‌مانده: {remaining} دقیقه

    🎁 بعد از پایان این زمان می‌تونی دوباره ستاره دریافت کنی.

  en: |
    ⏳ It's still too early to claim stars!

    🕐 Remaining time: {remaining} minutes

    🎁 You can claim stars again after this time.

pvpInvalidArg:
  fa: |
    ❌ فرمت دستور PvP اشتباهه!

    📌 استفاده صحیح:
    /pvp <amount>

    💡 مقدار موردنظر برای شرط رو بعد از دستور وارد کن.

  en: |
    ❌ Invalid PvP command format!

    📌 Correct usage:
    /pvp <amount>

    💡 Enter the amount you want to bet after the command.

pvpInvalidAmount:
  fa: |
    ❌ مقدار شرط واردشده معتبر نیست!

    📌 استفاده صحیح:
    /pvp <amount>

    💡 مقدار شرط باید یک عدد معتبر باشه.

  en: |
    ❌ The bet amount is invalid!

    📌 Correct usage:
    /pvp <amount>

    💡 The bet amount must be a valid number.

pvpInvalidAmountRange:
  fa: |
    ❌ مقدار شرط باید حداقل ۱ ستاره باشه!

    📌 استفاده صحیح:
    /pvp <amount>

    💡 مقدار شرط نمی‌تونه کمتر از ۱ باشه.

  en: |
    ❌ The bet amount must be at least 1 star!

    📌 Correct usage:
    /pvp <amount>

    💡 The bet amount cannot be less than 1.

pvpFloatAmount:
  fa: |
    😂 داداش ستاره‌ست، اعشار که نداریم!

    ⭐ مقدار شرط باید یه عدد کامل باشه.
    📌 مثلاً: /pvp 10

  en: |
    😂 Bro, they're stars, not decimals!

    ⭐ The bet amount must be a whole number.
    📌 Example: /pvp 10

pvpChallenge:
  fa: |
    🎲 شرط جدید

    👤 <a href="tg://user?id={userId}">{firstName}</a> چت رو به مبلغ ⭐ {amount} به چالش کشید!
    ⚔️ برای شرکت در رقابت، روی دکمه «قبول شرط» کلیک کن.

  en: |
    🎲 New Bet

    👤 <a href="tg://user?id={userId}">{firstName}</a> challenged the chat to a ⭐ {amount} bet!
    ⚔️ Click «Accept Bet» to join the competition.

pvpAccept:
  fa: "⚔️ قبول شرط"
  en: "⚔️ Accept Bet"

pvpCancel:
  fa: "❌ لغو شرط (توسط ایجاد کننده)"
  en: "❌ Cancel Bet (Creator Only)"

pvpInsufficientStars:
  fa: |
    ⭐ ستاره کافی ندارید!

    💰 مقدار مورد نیاز: {requiredStars}
    ⭐ موجودی شما: {stars}

  en: |
    ⭐ You don't have enough Stars!

    💰 Required: {requiredStars}
    ⭐ Your balance: {stars}

pvpNotFound:
  fa: |
    ❌ این PVP وجود ندارد یا دیگر در دسترس نیست.

  en: |
    ❌ This PVP does not exist or is no longer available.

pvpSelf:
  fa: |
    ❌ نمی‌توانید با خودتان شرط ببندید!

  en: |
    ❌ You can't bet against yourself!

pvpAcceptorInsufficientStars:
  fa: |
    ⭐ استار کافی ندارید!

    💰 مقدار مورد نیاز: {requiredStars}
    ⭐ موجودی شما: {stars}

  en: |
    ⭐ You don't have enough Stars!

    💰 Required: {requiredStars}
    ⭐ Your balance: {stars}

pvpCreatorInsufficientStars:
  fa: |
    ⭐ سازنده استار کافی ندارد!

    💰 مقدار مورد نیاز: {requiredStars}
    ⭐ موجودی سازنده: {stars}

  en: |
    ⭐ The creator doesn't have enough Stars!

    💰 Required: {requiredStars}
    ⭐ Creator's balance: {stars}
  
pvpUnavailable:
  fa: |
    ❌ این شرط منقضی شده یا قبلاً انجام شده است.

  en: |
    ❌ This PVP has expired or has already been completed.

pvpCancelUnauthorized:
  fa: |
    ❌ شما اجازه لغو این شرط را ندارید!

    🔒 فقط سازنده شرط می‌تواند آن را لغو کند.

  en: |
    ❌ You are not allowed to cancel this bet!

    🔒 Only the creator of this bet can cancel it.

pvpExpired:
  fa: |
    ⏳ این شرط با موفقیت منقضی شد!

    ❌ دیگر امکان قبول کردن این شرط وجود ندارد.

  en: |
    ⏳ This bet has successfully expired!

    ❌ This bet can no longer be accepted.

pvpResult:
  fa: |
    🏆 *نتیجه رقابت PvP*

    🎲 مبلغ شرط: ⭐ {amount} ستاره

    🥇 *برنده:*
    👤 <a href="tg://user?id={winnerId}">{winnerName}</a>
    💰 موجودی قبلی: {winnerOldStars} ستاره
    📈 موجودی جدید: {winnerNewStars} ستاره
    🎉 سود: +{amount} ستاره

    🥈 *بازنده:*
    👤 <a href="tg://user?id={loserId}">{loserName}</a>
    💰 موجودی قبلی: {loserOldStars} ستاره
    📉 موجودی جدید: {loserNewStars} ستاره
    💸 ضرر: -{amount} ستاره

    ⚔️ رقابت به پایان رسید!

  en: |
    🏆 *PvP Match Result*

    🎲 Bet Amount: ⭐ {amount} Stars

    🥇 *Winner:*
    👤 <a href="tg://user?id={winnerId}">{winnerName}</a>
    💰 Previous Balance: {winnerOldStars} Stars
    📈 New Balance: {winnerNewStars} Stars
    🎉 Profit: +{amount} Stars

    🥈 *Loser:*
    👤 <a href="tg://user?id={loserId}">{loserName}</a>
    💰 Previous Balance: {loserOldStars} Stars
    📉 New Balance: {loserNewStars} Stars
    💸 Loss: -{amount} Stars

    ⚔️ The match has ended!

stats:
  fa: |
    📊 *آمار حساب کاربری*

    👤 نام کاربر: <a href="tg://user?id={userId}">{firstName}</a>
    🆔 شناسه کاربری: `{userId}`

    ⭐ موجودی استار: {stars}

    ⏳ زمان تا دریافت استار بعدی: {remaining} دقیقه

  en: |
    📊 *Account Statistics*

    👤 Username: <a href="tg://user?id={userId}">{firstName}</a>
    🆔 User ID: `{userId}`

    ⭐ Star Balance: {stars}

    ⏳ Time Until Next Claim: {remaining} minutes

giveReplyRequired:
  fa: |
    ❌ برای استفاده از دستور Give باید به پیام کاربر موردنظر ریپلای کنید!

    💡 ابتدا روی پیام شخص موردنظر Reply بزنید و سپس دستور Give را ارسال کنید.

  en: |
    ❌ You must reply to a user's message to use the Give command!

    💡 First, reply to the message of the user you want to send Stars to, then use the Give command.

giveInvalidAmount:
  fa: |
    ❌ مقدار واردشده معتبر نیست!

    ⭐ مقدار استار باید یک عدد معتبر و صحیح باشه.
    📌 مثال: /give 10

  en: |
    ❌ The specified amount is invalid!

    ⭐ The Star amount must be a valid whole number.
    📌 Example: /give 10

giveInvalidArg:
  fa: |
    ❌ آرگومان‌های واردشده معتبر نیستند!

    📌 استفاده صحیح:
    /give <amount>

    💡 دستور رو با فرمت صحیح و مقدار موردنظر وارد کنید.

  en: |
    ❌ Invalid command arguments!

    📌 Correct usage:
    /give <amount>

    💡 Please use the correct command format and specify the desired amount.

giveFloatAmount:
  fa: |
    😂 استار که اعشاری نیست!

    ⭐ مقدار استار باید یک عدد کامل باشه.
    📌 مثلاً: /give 10

  en: |
    😂 Stars aren't decimals!

    ⭐ The Star amount must be a whole number.
    📌 Example: /give 10

giveInvalidAmountRange:
  fa: |
    ❌ مقدار استار باید حداقل ۱ باشه!

    ⭐ نمی‌تونی کمتر از ۱ استار ارسال کنی.
    📌 مثلاً: /give 10

  en: |
    ❌ The Star amount must be at least 1!

    ⭐ You cannot send less than 1 Star.
    📌 Example: /give 10

giveSelf:
  fa: |
    😂 می‌خوای به خودت استار بدی؟!

    ⭐ برای انتقال استار باید به پیام یه کاربر دیگه ریپلای کنی.

  en: |
    😂 Trying to give Stars to yourself?!

    ⭐ You must reply to another user's message to transfer Stars.

giveInsufficientStars:
  fa: |
    ⭐ استار کافی برای انتقال ندارید!

    💰 مقدار موردنیاز: {requiredStars} ستاره
    ⭐ موجودی شما: {stars} ستاره

  en: |
    ⭐ You don't have enough Stars to make this transfer!

    💰 Required amount: {requiredStars} Stars
    ⭐ Your balance: {stars} Stars

giveResult:
  fa: |
    💸 *گزارش انتقال استار*

    👤 *فرستنده:*
    <a href="tg://user?id={giverId}">{giverName}</a>
    💰 موجودی قبلی: {giverOldStars} استار
    📉 موجودی جدید: {giverNewStars} استار
    💸 مقدار انتقال: -{amount} استار

    👤 *گیرنده:*
    <a href="tg://user?id={receiverId}">{receiverName}</a>
    💰 موجودی قبلی: {receiverOldStars} استار
    📈 موجودی جدید: {receiverNewStars} استار
    🎉 مقدار دریافتی: +{amount} استار

    ✅ انتقال استار با موفقیت انجام شد!

  en: |
    💸 *Star Transfer Report*

    👤 *Sender:*
    <a href="tg://user?id={giverId}">{giverName}</a>
    💰 Previous Balance: {giverOldStars} Stars
    📉 New Balance: {giverNewStars} Stars
    💸 Transferred: -{amount} Stars

    👤 *Receiver:*
    <a href="tg://user?id={receiverId}">{receiverName}</a>
    💰 Previous Balance: {receiverOldStars} Stars
    📈 New Balance: {receiverNewStars} Stars
    🎉 Amount Received: +{amount} Stars

    ✅ Stars have been transferred successfully!
